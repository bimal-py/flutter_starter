name: flutter_starter
description: "Opinionated Flutter starter with feature-first architecture, BLoC, get_it/injectable DI, go_router, flutter_scale_kit, Firebase, sharing, and QR."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  hydrated_bloc: ^11.0.0
  equatable: ^3.0.0
  stream_transform: ^2.1.1

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Routing
  go_router: ^17.5.0

  # Sizing (responsive scaling)
  flutter_scale_kit: ^2.0.2

  # Theming
  dynamic_color: ^1.9.0
  flutter_colorpicker: ^1.1.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5

  # Env
  flutter_dotenv: ^6.0.1

  # HTTP / API (delete with lib/core/network/ if the app has no API)
  dio: ^5.9.2

  # Notifications (delete with lib/modules/notifications/ if unused)
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

  # Firebase (optional: only started when FIREBASE_ENABLED=true; setup in
  # lib/core/services/firebase_service.dart)
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  # Delete with lib/modules/fcm/ if push notifications aren't used.
  firebase_messaging: ^17.0.1
  # Delete with lib/modules/app_upgrade/ if remote-driven update alerts aren't used.
  firebase_remote_config: ^7.0.1

  # UI
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  flutter_widget_from_html: ^0.17.4

  # Image picking + compression (delete with lib/modules/image_picker/ if unused)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  image: ^4.5.4
  path: ^1.9.0
  lucide_icons_flutter: ^4.0.1
  skeletonizer: ^3.0.0
  loader_overlay: ^5.0.0
  fluttertoast: ^10.0.2

  # Material 3 color science (transitively pinned by Flutter SDK; the `any`
  # constraint avoids fighting that pin while declaring the direct usage).
  material_color_utilities: any

  # QR
  qr_flutter: ^4.1.0
  image_gallery_saver_plus: ^5.1.1

  # Native integrations
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  flutter_inappwebview: ^6.2.0-beta.3
  in_app_review: ^2.0.11

  # Ads (delete with lib/modules/mobile_ads/ if not using Google Mobile Ads)
  google_mobile_ads: ^9.2.0
  # iOS App Tracking Transparency: shows the ATT prompt so AdMob can use the
  # IDFA for personalised ads. No-op on Android. Imported only inside
  # lib/modules/mobile_ads/.
  app_tracking_transparency: ^2.0.6

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - .env
    - assets/images/
    - assets/images/logos/
    - assets/images/ads/

  # Inter is the default Latin face. NotoSansDevanagari is the font for
  # Nepali and Hindi, and Inter's fallback for Devanagari text in other
  # languages; see lib/core/theme/typography/localized_fonts.dart.
  # Drop or replace either family to suit your app.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-Black.ttf
          weight: 900

    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Bold.ttf
          weight: 700
